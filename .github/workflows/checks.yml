name: Source and CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_release.py
      - run: python -m compileall -q -x 'third_party|outputs|envs' .
      - run: python -m unittest discover -s tests -v
      - run: pip install -r requirements/gui.txt
      - run: python test_fast_selection.py && python mhr_filter_test.py
      - run: QT_QPA_PLATFORM=offscreen python tests/gui_startup.py
